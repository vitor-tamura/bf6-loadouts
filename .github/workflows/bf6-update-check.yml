# Saiu patch novo?
#
# Roda uma vez por dia e faz uma pergunta só à página de novidades da EA:
# apareceu algum Game Update que `data/versions` ainda não tem. Na esmagadora
# maioria das execuções a resposta é não, e o workflow termina em segundos.
#
# A versão sai do endereço do artigo — `/news/battlefield-6-game-update-1-4-1-5`
# —, nunca do corpo da página: o texto tem números de quatro grupos por toda
# parte (ids de componente), e colher um deles faria o pipeline processar uma
# versão que não existe.
#
# Este workflow não escreve nada no repositório. Quem escreve é o de
# processamento, que aplica e publica em `main` sem esperar revisão.

name: Verificar atualização do BF6

on:
  schedule:
    # 12:17 UTC (09:17 em Brasília), uma vez por dia. Era de seis em seis horas;
    # patch sai poucas vezes por mês, e um dia de atraso no catálogo não pesa.
    # Fora da hora cheia, que é quando o GitHub mais atrasa os agendamentos.
    - cron: '17 12 * * *'
  workflow_dispatch:

# Duas verificações ao mesmo tempo disparariam o processamento duas vezes para
# o mesmo patch. A segunda espera; ela vai encontrar a versão já processada.
concurrency:
  group: bf6-update-check
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Perguntar à EA
        id: discover
        run: |
          set -o pipefail
          resultado=$(npm run --silent catalog:discover -- --json)
          echo "$resultado" | head -c 2000
          versoes=$(echo "$resultado" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              const { updates } = JSON.parse(raw);
              process.stdout.write(updates.map((u) => u.version).join(" "));
            });
          ')
          echo "versions=$versoes" >> "$GITHUB_OUTPUT"
          echo "Versões a processar: ${versoes:-nenhuma}"

      # Um disparo só, sem versão: o processamento pega todas as que faltam, da
      # mais antiga até a mais recente publicada até hoje, e publica em `main`.
      # Um disparo por versão punha as execuções na mesma fila de concorrência,
      # e o GitHub guarda só uma pendente — as do meio seriam canceladas.
      # Versão já no catálogo cuja análise para o site não fechou — a API caiu,
      # ou o crédito e a cota gratuita acabaram no dia. Ela volta para a fila
      # aqui, sem esperar o próximo patch.
      - name: Análises pendentes
        id: analise
        run: |
          pendentes=$(npm run --silent catalog:analisar-patch -- --pendentes | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => process.stdout.write(JSON.parse(raw).pendentes.join(" ")));
          ')
          echo "pendentes=$pendentes" >> "$GITHUB_OUTPUT"
          echo "Análises pendentes: ${pendentes:-nenhuma}"

      # O CDN pode publicar a arte depois dos dados da arma. Enquanto
      # faltar imagem, reexecuta o processamento a cada seis horas; a etapa de
      # download não bloqueia o catálogo se a imagem ainda não existir.
      - name: Imagens novas pendentes
        id: imagens
        continue-on-error: true
        run: |
          if npm run --silent images -- --check; then
            echo "pendentes=" >> "$GITHUB_OUTPUT"
          else
            echo "pendentes=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar o processamento
        if: steps.discover.outputs.versions != '' || steps.analise.outputs.pendentes != '' || steps.imagens.outputs.pendentes != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run bf6-update-process.yml
