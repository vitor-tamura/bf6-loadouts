# Saiu patch novo?
#
# Roda de seis em seis horas e faz uma pergunta só à página de novidades da EA:
# apareceu algum Game Update que `data/versions` ainda não tem. Na esmagadora
# maioria das execuções a resposta é não, e o workflow termina em segundos.
#
# A versão sai do endereço do artigo — `/news/battlefield-6-game-update-1-4-1-5`
# —, nunca do corpo da página: o texto tem números de quatro grupos por toda
# parte (ids de componente), e colher um deles faria o pipeline processar uma
# versão que não existe.
#
# Este workflow não escreve nada no repositório. Quem escreve é o de
# processamento, e mesmo ele só escreve em branch.

name: Verificar atualização do BF6

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Duas verificações ao mesmo tempo disparariam o processamento duas vezes para
# o mesmo patch. A segunda espera; ela vai encontrar a versão já processada.
concurrency:
  group: bf6-update-check
  cancel-in-progress: false

# `pull-requests: read` não é detalhe: declarar um bloco `permissions` zera tudo
# o que não está listado, e sem esse escopo o `gh pr list` da última etapa
# responde 403. O passo inteiro falha antes de disparar coisa alguma — que é
# como a 1.4.2.0 saiu no dia 18 e nunca chegou a `data/versions`.
permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Perguntar à EA
        id: discover
        run: |
          set -o pipefail
          resultado=$(npm run --silent catalog:discover -- --json)
          echo "$resultado" | head -c 2000
          versoes=$(echo "$resultado" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              const { updates } = JSON.parse(raw);
              process.stdout.write(updates.map((u) => u.version).join(" "));
            });
          ')
          echo "versions=$versoes" >> "$GITHUB_OUTPUT"
          echo "Versões a processar: ${versoes:-nenhuma}"

      # Uma execução por versão, da mais antiga para a mais nova: cada uma parte
      # do estado deixado pela anterior.
      #
      # A lista chega por variável de ambiente, e não interpolada no meio do
      # script: `${{ }}` cola o texto antes de o shell existir, então um valor
      # torto viraria comando. Aqui ele é só um dado, e o `case` recusa o que
      # não tiver a cara de uma versão da EA.
      #
      # A busca por Pull Request aberto procura pelo branch, não pelo título: o
      # `--search ... in:title` depende do índice de busca do GitHub, que demora
      # a enxergar PR recém-aberto e devolvia vazio para um PR que existia.
      - name: Disparar o processamento
        if: steps.discover.outputs.versions != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSOES: ${{ steps.discover.outputs.versions }}
        run: |
          for versao in $VERSOES; do
            case "$versao" in
              [0-9]*.[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::warning::'$versao' não tem formato de versão — ignorada."; continue ;;
            esac

            if [ -n "$(gh pr list --state open --head "automation/bf6-update-$versao" --json number --jq '.[].number')" ]; then
              echo "::notice::Já existe Pull Request aberto para $versao — pulando."
              continue
            fi
            echo "Disparando processamento de $versao"
            gh workflow run bf6-update-process.yml -f version="$versao"
          done
