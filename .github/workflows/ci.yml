# A rede de segurança de todo commit.
#
# Antes havia um `catalog-validation.yml` à parte, que só rodava quando o diff
# tocava `data/**`: mudança em `src/` passava sem um teste rodar, e foi assim
# que o Gunsmith do site ficou meses sem o Acessório Esquerdo da L115 com o
# repositório inteiro verde. Ele repetia testes e tipos daqui, e a única coisa
# que só ele fazia — conferir que os arquivos gerados do catálogo estão
# commitados — mora agora no fim deste job.
#
# São quatro perguntas, na ordem em que ficam mais caras de responder: o código
# faz o que diz (testes), está escrito como o resto (lint), os tipos fecham, e o
# site compila. A quinta é a conferência de compatibilidade, que compara o
# montador com as fontes externas — ela é offline e roda em segundos, porque lê
# arquivo que já está no repositório.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push seguido de push na mesma branch não precisa das duas execuções: a
# primeira já não interessa quando a segunda existe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Falha em duas situações, e só nelas: peça que as duas fontes confirmam e
      # o montador não oferece, e divergência que o baseline da versão não
      # previa. O resto — conflito entre fontes, fonte única, exclusão declarada
      # — é aviso, porque um CI vermelho por evidência fraca empurra quem estiver
      # de plantão a cadastrar peça sem conferir, só para voltar ao verde.
      - name: Compatibilidade do montador com as fontes
        run: npm run catalog:compat

      # Índice e artefato do catálogo são derivados: se o que está commitado
      # diferir do que o pipeline gera, o repositório tem duas versões dos fatos.
      # `generatedAt` fica de fora porque muda a cada geração sem dado mudar, e
      # arquivo novo é conferido à parte porque `git diff` não o enxerga.
      - name: Arquivos gerados do catálogo em dia
        run: |
          npm run catalog:indexes
          npm run catalog:validate
          npm run catalog:build
          novos=$(git ls-files --others --exclude-standard -- data/indexes public/data)

          if ! git diff --quiet -I '"generatedAt"' -- data/indexes public/data || [ -n "$novos" ]; then
            echo "::error::Os arquivos gerados estão defasados. Rode 'npm run catalog' e commite o resultado."
            git diff --stat -- data/indexes public/data
            [ -n "$novos" ] && printf 'Sem commitar:
%s
' "$novos"
            exit 1
          fi
