# A trava do catálogo, em todo Pull Request.
#
# O pipeline de atualização abre PR sozinho, e quem revisa lê um resumo — não
# duas mil linhas de compatibilidade. Este workflow é o que confere o que
# ninguém vai conferir a olho: id repetido, relação apontando para arma que não
# existe, peça no slot errado, índice discordando da fonte de verdade.
#
# Ele roda também no push para main, porque edição manual em `data/` acontece
# — resolver um conflito de fontes é exatamente isso — e precisa passar pelas
# mesmas checagens que a automação passa.

name: Validar catálogo

on:
  pull_request:
    paths:
      - 'data/**'
      - 'public/data/**'
      - 'scripts/catalog/**'
      - 'src/catalog/**'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'public/data/**'
      - 'scripts/catalog/**'
      - 'src/catalog/**'
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Regerar índices
        run: npm run catalog:indexes

      - name: Validar
        run: npm run catalog:validate

      - name: Gerar o catálogo público
        run: npm run catalog:build

      # Índice e artefato são derivados: se o que está commitado diferir do que
      # o pipeline gera, o repositório tem duas versões dos fatos. A do commit
      # perde — mas a divergência precisa aparecer, e não ser corrigida calada.
      #
      # `generatedAt` fica de fora da comparação: ele guarda o instante da
      # geração e muda a cada execução, mesmo sem nenhum dado mudar. Sem esta
      # exclusão, a conferência acusaria defasagem em todo Pull Request e o
      # workflow viraria um alarme que ninguém pode desligar nem atender.
      - name: Conferir se os arquivos gerados estão atualizados
        run: |
          if ! git diff --quiet -I '"generatedAt"' -- data/indexes public/data; then
            echo "::error::Os arquivos gerados estão defasados. Rode 'npm run catalog' e commite o resultado."
            git diff --stat -- data/indexes public/data
            exit 1
          fi

      - name: Testes
        run: npm test

      - name: Tipos
        run: npm run typecheck
