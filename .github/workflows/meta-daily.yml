# Relê o meta uma vez por dia e publica o resultado.
#
# Diferente do `sync-data.yml`, este precisa publicar direto em `main`: o que ele
# grava é uma leitura de opinião pública, já filtrada contra o dataset — só entra
# arma que existe no jogo —, e a tela diz na cara que a lista é automática.
# Segurar isso atrás de um clique diário faria a tela congelar no último dia em
# que alguém lembrou de aprovar, que é justamente o problema que esta automação
# existe para resolver.
#
# Se vier bobagem, o diff mostra o que mudou e um `git revert` desfaz.

name: Atualizar meta

on:
  schedule:
    # 10:00 UTC, todo dia — manhã no Brasil, depois do pico de discussão da noite.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Duas execuções ao mesmo tempo escreveriam o mesmo arquivo e uma perderia.
concurrency:
  group: meta-daily
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Perguntar à busca
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run meta:search

      - name: Publicar em main se mudou
        env:
          MAIN_PUSH_TOKEN: ${{ secrets.MAIN_PUSH_TOKEN }}
        run: |
          if [ -z "${MAIN_PUSH_TOKEN}" ]; then
            echo "Secret MAIN_PUSH_TOKEN não configurado."
            exit 1
          fi

          if git diff --quiet -- src/data/meta-live.json; then
            echo "Sem alterações para publicar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/meta-live.json
          git commit -m "Atualiza o meta com a leitura do dia"
          git remote set-url origin "https://x-access-token:${MAIN_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main
