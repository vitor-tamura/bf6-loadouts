# Processa uma versão nova e abre Pull Request.
#
# Roda o mesmo comando que se roda na mão — `npm run catalog:update` —, e é de
# propósito: um workflow que executasse uma sequência própria de passos seria
# uma caixa preta que só falha em produção. Aqui, o que quebra no CI quebra
# igual na máquina de quem for consertar.
#
# ## O que ele nunca faz
#
# Escrever em `main`. Nem quando a mudança é óbvia, nem quando a validação passa
# limpa. O que sai daqui é sempre um branch `automation/bf6-update-<versão>` e
# um Pull Request — o catálogo alimenta um site que diz às pessoas o que montar,
# e uma leitura errada publicada sozinha é uma recomendação errada dada em nome
# do projeto.
#
# ## Seguro por padrão
#
# Se qualquer validação falhar, não há Pull Request: abre-se uma issue com o
# log. Um PR vermelho seria aprovado por engano num dia corrido; uma issue não
# se confunde com trabalho pronto.

name: Processar atualização do BF6

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do jogo, no formato 1.4.2.0'
        required: true
        type: string

concurrency:
  group: bf6-update-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Conferir o formato da versão
        run: |
          if ! echo '${{ inputs.version }}' | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${{ inputs.version }}' não é uma versão no formato da EA."
            exit 1
          fi

      # Idempotência: versão já processada não vira PR de novo.
      - name: A versão já existe?
        id: existe
        run: |
          if [ -d "data/versions/${{ inputs.version }}" ]; then
            echo "::notice::Versão ${{ inputs.version }} já processada. Nada a fazer."
            echo "pular=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Request já aberto?
        if: steps.existe.outputs.pular != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --state open --head "automation/bf6-update-${{ inputs.version }}" --json number \
            | grep -q '"number"'; then
            echo "::error::Já existe Pull Request aberto para ${{ inputs.version }}."
            exit 1
          fi

      - name: Versão anterior
        if: steps.existe.outputs.pular != '1'
        run: echo "ANTERIOR=$(ls data/versions | sort -V | tail -1)" >> "$GITHUB_ENV"

      # Baixa o patch note, lê, concilia, valida, gera diff, monta o catálogo e
      # mede a cobertura. Falhou qualquer etapa, o passo inteiro falha.
      - name: Atualizar o catálogo
        if: steps.existe.outputs.pular != '1'
        id: update
        run: npm run catalog:update -- --version '${{ inputs.version }}' 2>&1 | tee /tmp/update.log

      - name: Testes, lint, tipos e build
        if: steps.existe.outputs.pular != '1'
        id: checks
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build

      - name: Abrir issue quando o pipeline falhar
        if: failure() && steps.existe.outputs.pular != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[CATALOG] Falha ao processar a versão ${{ inputs.version }}" \
            --body "O pipeline falhou e **nenhum Pull Request foi aberto**.

          Versão: \`${{ inputs.version }}\`
          Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          O patch note baixado, se houver, está em \`data/patches/${{ inputs.version }}.json\`.
          O catálogo em \`main\` não foi alterado.

          Rode localmente para reproduzir:

          \`\`\`bash
          npm run catalog:update -- --version ${{ inputs.version }}
          \`\`\`"

      - name: Montar o corpo do Pull Request
        if: steps.existe.outputs.pular != '1'
        run: |
          node --experimental-strip-types scripts/catalog/pr-body.ts \
            '${{ inputs.version }}' "$ANTERIOR" > /tmp/pr-body.md
          cat /tmp/pr-body.md

      - name: Abrir o Pull Request
        if: steps.existe.outputs.pular != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="automation/bf6-update-${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data public/data
          git commit -m "feat(data): update Battlefield 6 to ${{ inputs.version }}"
          git push --set-upstream origin "$branch"

          gh pr create \
            --title "feat(data): update Battlefield 6 to ${{ inputs.version }}" \
            --body-file /tmp/pr-body.md
