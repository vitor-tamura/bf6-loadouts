# Processa as versões novas do jogo e publica direto em `main`.
#
# Roda o mesmo comando que se roda na mão — `npm run catalog:update` —, e é de
# propósito: um workflow que executasse uma sequência própria de passos seria
# uma caixa preta que só falha em produção. Aqui, o que quebra no CI quebra
# igual na máquina de quem for consertar.
#
# ## Sem revisão manual
#
# Antes, o que saía daqui era um Pull Request esperando aprovação, e o site
# ficava no patch anterior até alguém lembrar de aprovar. Agora a atualização é
# aplicada e publicada sozinha: o que o patch note diz com certeza entra no
# catálogo (`automation: auto`), o que ele diz de forma ambígua fica registrado
# como evento `review` no próprio catálogo — marcado, nunca adivinhado —, e os
# apelidos que a EA usa e o registro de patch prova são gravados no dataset.
#
# ## Sempre até a mais recente
#
# Sem versão informada, o comando descobre tudo o que a EA publicou até hoje e
# o catálogo ainda não tem, e processa da mais antiga para a mais nova: cada
# versão parte do estado deixado pela anterior, e é assim que o diff entre uma
# atualização e outra entra inteiro. Artigo com data depois de hoje fica para a
# rodada seguinte.
#
# ## O que ainda segura a publicação
#
# Testes, lint, tipos, compatibilidade e build. Qualquer um falhou, nada vai
# para `main`: abre-se uma issue com o log, e o site segue na versão anterior,
# que é o estado bom conhecido.

name: Processar atualização do BF6

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do jogo (1.4.2.0). Vazio = todas as que faltam, até a mais recente.'
        required: false
        type: string
        default: ''

# Uma fila só: duas execuções escrevendo em `main` ao mesmo tempo disputariam o
# push, e versões diferentes dependem umas das outras.
concurrency:
  group: bf6-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          # O passo de publicação faz rebase quando a main anda durante o
          # processamento, e rebase em clone raso não tem sobre o que se apoiar.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # A versão chega por variável de ambiente, e não interpolada no script:
      # `${{ }}` cola o texto antes de o shell existir, e um valor torto viraria
      # comando.
      - name: Conferir o formato da versão
        env:
          VERSAO: ${{ inputs.version }}
        run: |
          if [ -n "$VERSAO" ] && ! echo "$VERSAO" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSAO' não é uma versão no formato da EA."
            exit 1
          fi

      - name: Versão anterior
        run: echo "ANTERIOR=$(ls data/versions | sort -V | tail -1)" >> "$GITHUB_ENV"

      # Baixa o patch note, lê, concilia, valida, gera diff, monta o catálogo e
      # mede a cobertura — para uma versão, ou para todas as que faltam.
      #
      # `shell: bash` não é enfeite: com ele o Actions usa `bash -eo pipefail`,
      # e a falha antes do `| tee` volta a ser falha.
      - name: Atualizar o catálogo
        id: update
        shell: bash
        env:
          VERSAO: ${{ inputs.version }}
        run: |
          if [ -n "$VERSAO" ]; then
            npm run catalog:update -- --version "$VERSAO" 2>&1 | tee /tmp/update.log
          else
            npm run catalog:update 2>&1 | tee /tmp/update.log
          fi

      # Como a EA escreve o nome de cada arma, contra como o catálogo o guarda —
      # e, agora, gravado. A regra do script só aplica o apelido que a frase do
      # patch e o registro provam juntos; o resto continua só no relatório.
      - name: Nomes das fontes contra o dataset
        continue-on-error: true
        run: npm run catalog:nomes -- --aplicar

      # A peça que a fonte tem e o montador não vira arquivo de investigação.
      - name: Candidatos a cadastro
        continue-on-error: true
        run: npm run catalog:compat -- --candidatos

      # Em que armas cada peça nova entra: varredura de uma fonte que enumera o
      # slot inteiro, e pergunta a um modelo com busca só para o que sobrar.
      # `continue-on-error` porque depende de site de terceiro, e nenhuma falha
      # dele justifica segurar o patch.
      - name: Auditar os acessórios novos
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Reserva gratuita para quando o crédito da OpenAI acabar (scripts/meta/provedores.mjs).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PATCH_VERSION: ${{ inputs.version }}
        run: npm run catalog:perguntar-acessorios

      # A tranca que substitui a revisão: se o catálogo novo quebrar o site,
      # ele não é publicado.
      - name: Testes, lint, tipos e build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run catalog:compat
          npm run build

      - name: Publicar em main
        env:
          MAIN_PUSH_TOKEN: ${{ secrets.MAIN_PUSH_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- data public/data src/data)" ]; then
            echo "::notice::Nenhuma versão nova alterou o catálogo. Nada a publicar."
            exit 0
          fi

          if [ -z "${MAIN_PUSH_TOKEN}" ]; then
            echo "::error::Secret MAIN_PUSH_TOKEN não configurado."
            exit 1
          fi

          atual=$(ls data/versions | sort -V | tail -1)
          if [ "$atual" = "$ANTERIOR" ]; then
            mensagem="chore(data): atualiza dados da versão $atual"
          else
            mensagem="feat(data): atualiza Battlefield 6 de $ANTERIOR para $atual"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data src/data
          git commit -m "$mensagem"
          git remote set-url origin "https://x-access-token:${MAIN_PUSH_TOKEN}@github.com/${{ github.repository }}.git"

          # A `main` pode ter andado durante o processamento — a leitura diária
          # do meta escreve nela. Os arquivos das duas automações não se cruzam,
          # então o rebase é seguro.
          for tentativa in 1 2 3; do
            git push origin HEAD:main && { echo "Publicado: $mensagem"; exit 0; }
            echo "::warning::A main andou. Tentativa $tentativa: rebase e novo push."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; break; }
          done

          echo "::error::Não foi possível publicar a atualização na main."
          exit 1

      # Este passo é o último de propósito: `failure()` só enxerga a falha que já
      # aconteceu quando chega a vez dele, e o push é onde a execução se perde.
      - name: Abrir issue quando o pipeline falhar
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ inputs.version }}
        run: |
          alvo="${VERSAO:-todas as versões pendentes}"
          gh issue create \
            --title "[CATALOG] Falha ao processar $alvo" \
            --body "O pipeline falhou e **nada foi publicado em main**. O site segue na versão $ANTERIOR.

          Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Rode localmente para reproduzir:

          \`\`\`bash
          npm run catalog:update ${VERSAO:+-- --version $VERSAO}
          \`\`\`"
